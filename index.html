<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var framed = true;
        try { framed = window.self !== window.top; } catch (e) {}
        var hostOrDeviceDark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var pick = 'light';
        try { pick = localStorage.getItem('pc-theme') || 'light'; } catch (e) {}
        var dark = framed ? hostOrDeviceDark : pick === 'dark' || (pick === 'device' && hostOrDeviceDark);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphics Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Roboto:wght@400;500;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
